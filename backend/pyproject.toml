[project]
name = "painel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn[standard]", "httpx", "tzdata"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["painel", "painel.espn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
