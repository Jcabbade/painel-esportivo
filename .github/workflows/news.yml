name: Notícias

# Robô de notícias: a cada 30 min lê as fontes e grava news.json no ramo `news`.
# O ramo guarda só a versão mais recente (commit único, sobrescrito), para não crescer.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Arquivo anterior
        run: |
          mkdir -p news-store
          curl -sfL "https://raw.githubusercontent.com/${{ github.repository }}/news/news.json" -o news-store/news.json \
            || rm -f news-store/news.json
      - name: Buscar notícias
        run: npm run update-news -- ../news-store/news.json
        working-directory: frontend
      - name: Publicar no ramo news
        working-directory: news-store
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b news
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "notícias: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:news
