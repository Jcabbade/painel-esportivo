name: Notícias

# Robô de notícias: a cada 30 min lê as fontes e grava news.json no ramo `news`.
# O ramo guarda só a versão mais recente (commit único, sobrescrito), para não crescer.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # o token de escrita não fica no disco durante o npm ci
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Arquivo anterior
        # Lido pelo git (sem cache de CDN). Ramo inexistente = começa vazio; qualquer outra falha interrompe,
        # para nunca sobrescrever o arquivo bom com um vazio.
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir -p news-store
          REMOTE="https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          set +e
          git ls-remote --exit-code --heads "$REMOTE" news > /dev/null
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "ramo news ainda não existe: começando vazio"
          elif [ "$code" = "0" ]; then
            git fetch -q --depth=1 "$REMOTE" news
            git show FETCH_HEAD:news.json > news-store/news.json
          else
            echo "não foi possível consultar o ramo news (código $code)"; exit 1
          fi
      - name: Buscar notícias
        run: npm run update-news -- ../news-store/news.json
        working-directory: frontend
      - name: Publicar no ramo news
        working-directory: news-store
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b news
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -q -m "notícias: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:news
